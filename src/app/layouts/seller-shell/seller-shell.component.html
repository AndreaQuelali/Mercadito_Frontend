<div class="seller-shell">
  <div
    class="seller-shell__overlay"
    *ngIf="drawerOpen()"
    (click)="closeDrawer()"
    aria-hidden="true"
  ></div>

  <aside
    class="seller-shell__sidebar"
    [class.is-open]="drawerOpen()"
    aria-label="Navegación de la tienda"
  >
    <div class="seller-shell__brand">
      <span class="seller-shell__mark" aria-hidden="true">M</span>
      <span>Mi tienda</span>
    </div>

    <nav class="seller-shell__nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        class="seller-shell__item"
        [class.is-soon]="item.soon"
        (click)="closeDrawer()"
      >
        <svg *ngIf="item.icon === 'home'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 1-1.06 1.06l-.72-.72V21a.75.75 0 0 1-.75.75h-4.5a.75.75 0 0 1-.75-.75v-4.5H9.75V21a.75.75 0 0 1-.75.75H4.5A.75.75 0 0 1 3.75 21v-8.13l-.72.72a.75.75 0 0 1-1.06-1.06l8.69-8.69Z"/></svg>
        <svg *ngIf="item.icon === 'box'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.375 3C2.339 3 1.5 3.84 1.5 4.875v.75c0 1.036.84 1.875 1.875 1.875h17.25c1.035 0 1.875-.84 1.875-1.875v-.75C22.5 3.839 21.66 3 20.625 3H3.375Z"/><path fill-rule="evenodd" d="m3.087 9 .54 9.176A3 3 0 0 0 6.62 21h10.757a3 3 0 0 0 2.995-2.824L20.913 9H3.087Zm6.163 3.75A.75.75 0 0 1 10 12h4a.75.75 0 0 1 0 1.5h-4a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"/></svg>
        <svg *ngIf="item.icon === 'orders'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.502 6h7.128A3.375 3.375 0 0 1 18 9.375v9.375a3 3 0 0 0 3-3V6.108c0-1.505-1.125-2.811-2.664-2.94A3 3 0 0 0 15 1.5h-1.5a3 3 0 0 0-2.663 1.618C8.662 3.295 7.554 4.542 7.502 6ZM13.5 3A1.5 1.5 0 0 0 12 4.5h4.5A1.5 1.5 0 0 0 15 3h-1.5Z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M3 9.375C3 8.339 3.84 7.5 4.875 7.5h9.75c1.036 0 1.875.84 1.875 1.875v11.25c0 1.035-.84 1.875-1.875 1.875h-9.75A1.875 1.875 0 0 1 3 20.625V9.375Z" clip-rule="evenodd"/></svg>
        <svg *ngIf="item.icon === 'chart'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.375 2.25c-1.035 0-1.875.84-1.875 1.875v15.75c0 1.035.84 1.875 1.875 1.875h.75c1.035 0 1.875-.84 1.875-1.875V4.125c0-1.036-.84-1.875-1.875-1.875h-.75ZM9.75 8.625c0-1.036.84-1.875 1.875-1.875h.75c1.036 0 1.875.84 1.875 1.875v11.25c0 1.035-.84 1.875-1.875 1.875h-.75a1.875 1.875 0 0 1-1.875-1.875V8.625ZM3 13.125c0-1.036.84-1.875 1.875-1.875h.75c1.036 0 1.875.84 1.875 1.875v6.75c0 1.035-.84 1.875-1.875 1.875h-.75A1.875 1.875 0 0 1 3 19.875v-6.75Z"/></svg>
        <svg *ngIf="item.icon === 'stock'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.375 3C2.339 3 1.5 3.84 1.5 4.875v.75c0 1.036.84 1.875 1.875 1.875h17.25c1.035 0 1.875-.84 1.875-1.875v-.75C22.5 3.839 21.66 3 20.625 3H3.375Z"/><path d="m3.087 9 .54 9.176A3 3 0 0 0 6.62 21h10.757a3 3 0 0 0 2.995-2.824L20.913 9H3.087Z"/></svg>
        <svg *ngIf="item.icon === 'store'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5V9a3 3 0 0 1-3 3v6a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 18v-6a3 3 0 0 1-3-3V7.5Z"/></svg>
        <svg *ngIf="item.icon === 'gear'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.828 2.25c-.916 0-1.699.663-1.85 1.567l-.091.55a.798.798 0 0 1-.52.65 7.47 7.47 0 0 0-1.99.99.798.798 0 0 1-.81.062l-.517-.277a1.875 1.875 0 0 0-2.56.818l-.813 1.456a1.875 1.875 0 0 0 .818 2.56l.517.277a.798.798 0 0 1 .45.76 7.48 7.48 0 0 0 0 1.98.798.798 0 0 1-.45.76l-.517.277a1.875 1.875 0 0 0-.818 2.56l.813 1.456a1.875 1.875 0 0 0 2.56.818l.517-.277a.798.798 0 0 1 .81.062 7.47 7.47 0 0 0 1.99.99.798.798 0 0 1 .52.65l.091.55a1.875 1.875 0 0 0 1.85 1.567h1.344c.916 0 1.699-.663 1.85-1.567l.091-.55a.798.798 0 0 1 .52-.65 7.47 7.47 0 0 0 1.99-.99.798.798 0 0 1 .81-.062l.517.277a1.875 1.875 0 0 0 2.56-.818l.813-1.456a1.875 1.875 0 0 0-.818-2.56l-.517-.277a.798.798 0 0 1-.45-.76 7.48 7.48 0 0 0 0-1.98.798.798 0 0 1 .45-.76l.517-.277a1.875 1.875 0 0 0 .818-2.56l-.813-1.456a1.875 1.875 0 0 0-2.56-.818l-.517.277a.798.798 0 0 1-.81-.062 7.47 7.47 0 0 0-1.99-.99.798.798 0 0 1-.52-.65l-.091-.55A1.875 1.875 0 0 0 13.172 2.25h-1.344ZM12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z" clip-rule="evenodd"/></svg>
        {{ item.label }}
        <span *ngIf="item.soon" class="seller-shell__soon">Pronto</span>
      </a>
    </nav>
  </aside>

  <div class="seller-shell__main">
    <header class="seller-shell__topbar">
      <button
        type="button"
        class="seller-shell__burger"
        (click)="toggleDrawer()"
        [attr.aria-expanded]="drawerOpen()"
        aria-label="Abrir menú de la tienda"
      >
        <span></span><span></span><span></span>
      </button>

      <div class="seller-shell__store">
        <strong>{{ storeName() }}</strong>
        <small>Panel de gestión</small>
      </div>

      <div class="seller-shell__user" (click)="$event.stopPropagation()">
        <button
          type="button"
          class="seller-shell__trigger"
          (click)="toggleMenu($event)"
          [attr.aria-expanded]="menuOpen()"
        >
          <span class="seller-shell__name">{{ auth.currentUser()?.name }}</span>
          <span class="seller-shell__avatar">{{ initial() }}</span>
        </button>
        <div class="seller-shell__menu" *ngIf="menuOpen()">
          <a routerLink="/home">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.25 2.25a.75.75 0 0 0 0 1.5H4.5l.401 1.605 1.2 4.8A2.25 2.25 0 0 0 7.875 11.25h8.4a2.25 2.25 0 0 0 2.174-1.644l1.101-4.141A.75.75 0 0 0 18.825 4.5H6.226l-.3-1.2A1.5 1.5 0 0 0 4.5 2.25H2.25Z"/><path d="M6.75 19.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10.5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
            Comprar en Mercadito
          </a>
          <hr />
          <button type="button" class="seller-shell__logout" (click)="auth.logout()">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 0 0 6 5.25v13.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5V15a.75.75 0 0 1 1.5 0v3.75a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3V5.25a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3V9A.75.75 0 0 1 15 9V5.25a1.5 1.5 0 0 0-1.5-1.5h-6Zm10.72 4.72a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 1 1-1.06-1.06l1.72-1.72H9a.75.75 0 0 1 0-1.5h10.94l-1.72-1.72a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>

    <div class="seller-shell__content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
